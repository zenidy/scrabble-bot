[package]
name = "scrabble-bot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Scrabbler: a bot for the SpacetimeDB ScrabbleBot word-auction event"
publish = false

[[bin]]
name = "scrabbler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spacetimedb-sdk = "=2.14.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
